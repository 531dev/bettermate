<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#e9e9e9" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BetterMate" />

    <link rel="manifest" href="/app.webmanifest" />
    <link
      rel="preload"
      href="/fonts/FunnelDisplay-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/GeistMono-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="shortcut icon" type="image/svg+xml" href="/bettermate.svg" />
    <link rel="apple-touch-icon" href="/bettermate-192.png" />
    <title>BetterMate Web UI</title>
    <style>
      /* The page ground until the stylesheet arrives: surface-0, stamped by gen_web_assets.py. */
      html {
        background: #e9e9e9;
      }
      html[data-theme='dark'] {
        background: #212121;
      }
    </style>
    <script>
      // Resolve the saved theme before the first paint, so the page never shows the other ground.
      (function () {
        var theme = 'system';
        try {
          var saved = localStorage.getItem('gaggimate-daisyui-theme');
          if (saved === 'coffee') saved = 'dark';
          if (saved === 'nord') saved = 'light';
          if (saved === 'light' || saved === 'dark') theme = saved;
        } catch (e) {}
        if (theme === 'system')
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        var root = document.documentElement;
        root.setAttribute('data-theme', theme);
        document.querySelector('meta[name="theme-color"]').content =
          getComputedStyle(root).backgroundColor;
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
