on:
  push:
    tags:
      - "v*"

# BetterMate releases the display only. The controller stays on stock GaggiMate v1.9.0 (its OTA is pinned to the
# upstream release), and there is no update server: displays read GitHub's latest release (RELEASE_URL).
name: Build
jobs:
  ota-testbench:
    uses: ./.github/workflows/ota-testbench.yml
  build:
    needs: ota-testbench
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0
          submodules: 'recursive'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO Core and esptool
        run: pip install --upgrade platformio "esptool<5"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Add version
        run: |
          mkdir -p out
          git describe --tags --dirty --exclude nightly --exclude db > out/version.txt
          cat out/version.txt
      - name: Build Web
        run: ./scripts/build_webui.sh
      - name: Build display FS
        run: |
          pio run -t buildfs -e display
          cp .pio/build/display/littlefs.bin out/display-filesystem.bin
          cp .pio/build/display/littlefs.bin out/display-headless-filesystem.bin
      - name: Build display
        run: |
          pio run -e display
          cp .pio/build/display/firmware.bin out/display-firmware.bin
          cp .pio/build/display/partitions.bin out/display-partitions.bin
          cp .pio/build/display/bootloader.bin out/display-bootloader.bin
      - name: Build headless
        run: |
          pio run -e display-headless
          cp .pio/build/display-headless/firmware.bin out/display-headless-firmware.bin
          cp .pio/build/display-headless/partitions.bin out/display-headless-partitions.bin
          cp .pio/build/display-headless/bootloader.bin out/display-headless-bootloader.bin
      # One image to write at 0x0 over USB for a first install. Offsets are default_16MB.csv (boards/LilyGo-T-RGB.json).
      # It includes the filesystem, so it replaces the display's profiles and shot history.
      - name: Merge display image
        run: |
          esptool.py --chip esp32s3 merge_bin -o out/display-full.bin \
            0x0 out/display-bootloader.bin \
            0x8000 out/display-partitions.bin \
            0xe000 docs/boot_app0.bin \
            0x10000 out/display-firmware.bin \
            0xc90000 out/display-filesystem.bin
      - name: Archive Firmware Files
        uses: actions/upload-artifact@v4
        with:
          name: bettermate-firmware
          path: "out/*"

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Firmware Files
        uses: actions/download-artifact@v4
        with:
          name: bettermate-firmware
          path: release
      - name: Release Firmware
        uses: ncipollo/release-action@bcfe5470707e8832e12347755757cec0eb3c22af
        if: startsWith(github.ref, 'refs/tags/')
        with:
          artifacts: release/*.bin,release/version.txt
          generateReleaseNotes: true
          allowUpdates: true
          omitBodyDuringUpdate: true
          token: ${{ secrets.GITHUB_TOKEN }}
