<!-- @dsCard group="Round display" height=380 width=1296 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Tick ring</title></head>
<body>
<div class="bm-stage">
  <figure class="bm-fig"><div id="split"></div><figcaption>Split: boiler left, pump right</figcaption></figure>
  <figure class="bm-fig"><div id="single"></div><figcaption>Single: one quantity, 300 degrees</figcaption></figure>
  <figure class="bm-fig"><div id="progress"></div><figcaption>Progress: grind, in ink</figcaption></figure>
  <figure class="bm-fig"><div id="standby"></div><figcaption>Standby: residual heat, greyed</figcaption></figure>
</div>
<script>
var B = BetterMate, t = B.draw.tx;
function put(id, ring, a, b, c) { document.getElementById(id).innerHTML = B.wrap(B.ringParts(ring) + t(240, 222, 'bmf-value bmf-ink', a) + t(240, 262, 'bmf-label bmf-muted', b) + t(240, 292, 'bmf-label bmf-muted', c)); }
put('split', { left: [0.58, 0.58, 'heat'], right: [0.56, 0.5625, 'primary'] }, '36 + 36', 'TICKS, 4° APART', 'NOTCH = TARGET');
put('single', { full: [0.8, 0.906, 'heat'] }, '76', 'TICKS OVER 300°', '0 TO 160 °C');
put('progress', { full: [0.63, -1, 'ink'] }, '63%', 'ONE TICK = 1.3%', 'NO NOTCH');
put('standby', { full: [0.13, -1, 'faint'] }, '21°', 'INK-FAINT', 'NO NOTCH');
</script>
</body>
</html>
