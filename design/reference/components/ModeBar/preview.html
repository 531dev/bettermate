<!-- @dsCard group="Navigation" height=292 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Mode bar</title></head>
<body>
<div class="bm-stage">
  <div class="bm-stack" style="width:366px"><span class="bm-eyebrow">At rest</span><nav class="bm-modebar" aria-label="Machine mode">
  <button class="bm-modebar__item" aria-pressed="false"><span data-icon="power" data-size="22"></span>Standby</button>
  <button class="bm-modebar__item" aria-pressed="true"><span data-icon="coffee" data-size="22"></span>Brew</button>
  <button class="bm-modebar__item" aria-pressed="false"><span data-icon="wind" data-size="22"></span>Steam</button>
  <button class="bm-modebar__item" aria-pressed="false"><span data-icon="droplet" data-size="22"></span>Water</button>
  <button class="bm-modebar__item" aria-pressed="false"><span data-icon="bean" data-size="22"></span>Grind</button>
</nav></div>
  <div class="bm-stack" style="width:366px"><span class="bm-eyebrow">While a shot runs</span><nav class="bm-modebar" aria-label="Machine mode">
  <button class="bm-modebar__item" aria-pressed="false" aria-disabled="true" aria-describedby="lock"><span data-icon="power" data-size="22"></span>Standby</button>
  <button class="bm-modebar__item" aria-pressed="true"><span data-icon="coffee" data-size="22"></span>Brew</button>
  <button class="bm-modebar__item" aria-pressed="false"><span data-icon="wind" data-size="22"></span>Steam</button>
  <button class="bm-modebar__item" aria-pressed="false" aria-disabled="true" aria-describedby="lock"><span data-icon="droplet" data-size="22"></span>Water</button>
  <button class="bm-modebar__item" aria-pressed="false" aria-disabled="true" aria-describedby="lock"><span data-icon="bean" data-size="22"></span>Grind</button>
</nav><p class="bm-help bm-modebar__note" id="lock">Locked while a shot runs. Steam stays available.</p></div>
  <div class="bm-stack" style="width:296px"><span class="bm-eyebrow">At 320 px</span><nav class="bm-modebar" aria-label="Machine mode">
  <button class="bm-modebar__item" aria-pressed="false"><span data-icon="power" data-size="22"></span>Standby</button>
  <button class="bm-modebar__item" aria-pressed="false"><span data-icon="coffee" data-size="22"></span>Brew</button>
  <button class="bm-modebar__item" aria-pressed="true"><span data-icon="wind" data-size="22"></span>Steam</button>
  <button class="bm-modebar__item" aria-pressed="false"><span data-icon="droplet" data-size="22"></span>Water</button>
  <button class="bm-modebar__item" aria-pressed="false"><span data-icon="bean" data-size="22"></span>Grind</button>
</nav></div>
  <div class="bm-stack" style="width:296px"><span class="bm-eyebrow">No grinder</span><nav class="bm-modebar" aria-label="Machine mode">
  <button class="bm-modebar__item" aria-pressed="true"><span data-icon="power" data-size="22"></span>Standby</button>
  <button class="bm-modebar__item" aria-pressed="false"><span data-icon="coffee" data-size="22"></span>Brew</button>
  <button class="bm-modebar__item" aria-pressed="false"><span data-icon="wind" data-size="22"></span>Steam</button>
  <button class="bm-modebar__item" aria-pressed="false"><span data-icon="droplet" data-size="22"></span>Water</button>
</nav></div>
  <div class="bm-stack" style="width:400px"><span class="bm-eyebrow">Desktop, 400 px</span><nav class="bm-modebar" aria-label="Machine mode">
  <button class="bm-modebar__item" aria-pressed="false"><span data-icon="power" data-size="22"></span>Standby</button>
  <button class="bm-modebar__item" aria-pressed="true"><span data-icon="coffee" data-size="22"></span>Brew</button>
  <button class="bm-modebar__item" aria-pressed="false"><span data-icon="wind" data-size="22"></span>Steam</button>
  <button class="bm-modebar__item" aria-pressed="false"><span data-icon="droplet" data-size="22"></span>Water</button>
  <button class="bm-modebar__item" aria-pressed="false"><span data-icon="bean" data-size="22"></span>Grind</button>
</nav></div>
</div>
<script>
BetterMate.hydrate();
[].forEach.call(document.querySelectorAll('.bm-modebar'), function (g) {
  g.addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b || b.getAttribute('aria-disabled') === 'true') return; [].forEach.call(g.querySelectorAll('button'), function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); }); });
});
</script>
</body>
</html>
