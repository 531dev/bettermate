<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Segment bar</title></head>
<body>
<div class="bm-stage">
  <div class="bm-stack" style="width:220px"><span class="bm-eyebrow">Level, 20 segments</span><div class="bm-segbar bm-segbar--fill" data-segbar="19/20"></div><div class="bm-segbar bm-segbar--fill" data-segbar="4/20"></div></div>
  <div class="bm-stack" style="width:220px"><span class="bm-eyebrow">Value against a target</span><div class="bm-segbar bm-segbar--fill bm-segbar--heat" data-segbar="10/20/12"></div><div class="bm-segbar bm-segbar--fill bm-segbar--primary" data-segbar="11/20/11"></div></div>
  <div class="bm-stack" style="width:220px"><span class="bm-eyebrow">Series tones</span><div class="bm-segbar bm-segbar--fill bm-segbar--flow" data-segbar="8/20"></div><div class="bm-segbar bm-segbar--fill bm-segbar--weight" data-segbar="12/20/19"></div></div>
  <div class="bm-stack" style="width:220px"><span class="bm-eyebrow">Dot matrix: 14 shots this week</span><div class="bm-dots" style="--cols:14" data-dots="14/28"></div></div>
</div>
<script>
BetterMate.hydrate();
</script>
</body>
</html>
