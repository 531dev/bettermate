<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Display · Brew — preview</title>
<style>

<body>
<div class="bm-screen bm-screen--framed" role="img" aria-label="Brew screen: Adaptive v2, 28 seconds, 9.0 of 9 bar, 93.4 of 93 degrees">
